# https://pagescms.org/docs/configuration/
media:
  - name: uploads
    input: public/uploads
    output: /uploads
    categories: [image]
  - name: site-icons
    label: Site icons
    input: public
    output: /
    extensions: [svg, png, ico]

links:
  - name: live-website
    label: Live website
    url: https://www.google.com
  - name: preview-website
    label: Preview website
    url: https://www.google.com

actions:
  - name: deploy-preview
    label: Deploy preview
    workflow: deploy.yml
    ref: current
    confirm:
      title: Deploy preview website?
      message: This will update your preview website
      button: Deploy
  - name: deploy
    label: Deploy
    workflow: deploy.yml
    ref: current
    confirm:
      title: Deploy website?
      message: This will update your live website.
      button: Deploy

# Reuse these field groups when adding pages.
components:
  meta:
    type: object
    label: Page metadata
    required: true
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Meta description
        type: text
        required: true
  intro:
    type: object
    required: true
    fields:
      - name: heading
        label: Heading
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
  link:
    type: object
    required: true
    fields:
      - name: label
        label: Link text
        type: string
        required: true
      - name: href
        label: Destination
        type: string
        required: true
        description: Use /blog for a page or https://example.com for an external link.
  itemGrid:
    type: object
    required: true
    fields:
      - name: heading
        label: Section heading
        type: string
        required: true
      - name: items
        label: Items
        component: intro
        list: true

content:
  - name: home
    label: Home
    type: file
    path: src/data/home.json
    format: json
    operations:
      delete: false
    fields:
      - name: meta
        component: meta
      - name: intro
        label: Introduction
        component: intro
      - name: highlights
        label: Highlights
        component: itemGrid
      - name: latestPosts
        label: Latest posts
        type: object
        required: true
        fields:
          - name: heading
            label: Section heading
            type: string
            required: true
          - name: link
            label: Blog link
            component: link
          - name: empty
            label: No posts message
            type: text
            required: true

  - name: blogPage
    label: Blog page
    type: file
    path: src/data/blog.json
    format: json
    operations:
      delete: false
    fields:
      - name: meta
        component: meta
      - name: intro
        label: Introduction
        component: intro
      - name: filter
        label: Post filter
        type: object
        required: true
        fields:
          - name: label
            label: Search label
            type: string
            required: true
          - name: placeholder
            label: Search placeholder
            type: string
            required: true
          - name: empty
            label: No posts message
            type: text
            required: true
          - name: noResults
            label: No search results message
            type: text
            required: true

  - name: posts
    label: Blog posts
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    subfolders: false
    filename:
      template: "{primary}.md"
      field: create
    # Filenames define public URLs; preserve them after creation.
    operations:
      rename: false
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: pubDate
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
        description: Used in post lists, search, and the meta description.
      - name: pubDate
        label: Publication date
        type: date
        required: true
        options:
          time: false
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: false
        description: Drafts are excluded from the site. Dates control sorting, not scheduled publishing.
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown

  - name: site
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    operations:
      delete: false
    fields:
      - name: name
        label: Site name
        type: string
        required: true
      - name: favicon
        label: Favicon
        type: image
        required: true
        description: The browser tab icon. Upload or select an SVG, PNG, or ICO file.
        options:
          media: site-icons
          path: public
          extensions: [svg, png, ico]
      - name: navigation
        label: Navigation links
        component: link
        list: true
      - name: footer
        label: Footer text
        type: text
        required: true
      - name: labels
        label: Interface labels
        type: object
        required: true
        fields:
          - name: navigation
            label: Navigation accessibility label
            type: string
            required: true
          - name: skipToContent
            label: Skip link text
            type: string
            required: true
          - name: backToBlog
            label: Back to blog link text
            type: string
            required: true
